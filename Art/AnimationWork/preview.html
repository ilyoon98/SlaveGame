<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>검사 애니메이션 검토</title>
<style>
body{margin:0;padding:24px;background:#202630;color:#eee5cf;font:15px system-ui,sans-serif}main{max-width:920px;margin:auto}h1{font-size:23px}p{color:#c4ced4}canvas{display:block;width:100%;image-rendering:pixelated;background:#fff;border-radius:8px}button,select{padding:9px 14px;margin:8px 8px 8px 0;border:1px solid #64717f;border-radius:4px;background:#344760;color:#fff;font:inherit}button:focus-visible,select:focus-visible{outline:3px solid #d5af59}output{font-variant-numeric:tabular-nums}.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
</style>
<main><h1>검사 · 걷기 / 공격</h1><p>같은 팔레트와 기준점으로 내보낸 실제 게임 프레임을 재생합니다.</p>
<canvas width="880" height="400" aria-label="걷기와 공격 애니메이션 비교"></canvas>
<div class="row"><button id="pause">일시 정지</button><button id="step">다음 프레임</button><label>재생 속도 <select id="speed"><option value="1">1배</option><option value="0.5">0.5배</option><option value="0.25">0.25배</option></select></label><label>표시 크기 <select id="scale"><option value="3">3배</option><option value="1">원본 크기</option></select></label></div>
<output id="status">애니메이션 불러오는 중</output></main>
<script type="module">
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;
const status=document.querySelector('#status'),pause=document.querySelector('#pause');
let elapsed=0,last=performance.now(),playing=true,meta,image;
const choose=(anim,t)=>{const length=anim.frames.reduce((n,f)=>n+f.duration,0);let pos=t%length;for(let i=0;i<anim.frames.length;i++){if(pos<anim.frames[i].duration)return[i,anim.frames[i]];pos-=anim.frames[i].duration;}return[0,anim.frames[0]];};
pause.onclick=()=>{playing=!playing;pause.textContent=playing?'일시 정지':'재생';};
document.querySelector('#step').onclick=()=>{playing=false;pause.textContent='재생';elapsed+=55;};
function draw(now){if(playing)elapsed+=(now-last)*Number(document.querySelector('#speed').value);last=now;
if(meta){ctx.fillStyle='#fff';ctx.fillRect(0,0,880,400);const scale=Number(document.querySelector('#scale').value);const indices=[];
for(const [i,key] of ['walk','attack'].entries()){const[index,f]=choose(meta.animations[key],elapsed);indices.push(index);const x=220+i*440,y=345;ctx.strokeStyle='#d6d8db';ctx.beginPath();ctx.moveTo(x-185,y+.5);ctx.lineTo(x+185,y+.5);ctx.stroke();ctx.drawImage(image,f.x,f.y,f.w,f.h,x-meta.pivot.x*scale,y-meta.pivot.y*scale,f.w*scale,f.h*scale);ctx.fillStyle='#344760';ctx.font='18px system-ui';ctx.fillText(`${key==='walk'?'걷기':'공격'} · ${String(index).padStart(2,'0')} / 13`,x-65,32);}
status.textContent=`걷기 프레임 ${indices[0]} · 공격 프레임 ${indices[1]} · ${meta.frameWidth}×${meta.frameHeight}px`;status.dataset.walk=indices[0];status.dataset.attack=indices[1];status.dataset.playing=String(playing);}
requestAnimationFrame(draw);}
try{meta=await(await fetch('../../Assets/Characters/swordsman/atlas.json')).json();image=new Image();image.src='../../Assets/Characters/swordsman/'+meta.image;await image.decode();requestAnimationFrame(draw);}catch(error){status.textContent='애니메이션 파일을 불러오지 못했습니다. '+error.message;}
</script></html>
