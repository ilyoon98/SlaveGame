<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f3028">
  <title>이끼송곳니 거점</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./world-ui.css">
</head>
<body>
  <main class="game-screen" aria-label="이끼송곳니 거점">
    <div id="camera" class="camera" tabindex="0" aria-label="거점 지도, 방향키로 가로 이동">
      <div class="world">
        <canvas id="game-canvas" width="1536" height="768" aria-label="이끼송곳니 거점"></canvas>
        <nav class="world-signs" aria-label="거점 시설">
          <button type="button" data-facility="rest" data-icon="bed" style="--x:11%;--y:68%">숙소</button>
          <button type="button" data-facility="education" data-icon="target" style="--x:30%;--y:71%">교육장</button>
          <button type="button" data-facility="arena" data-icon="sword" style="--x:50%;--y:69%">경기장</button>
          <button type="button" data-facility="show" data-icon="music" style="--x:70%;--y:63%">공연장</button>
          <button type="button" data-facility="market" data-icon="coin" style="--x:88%;--y:70%">거래소</button>
        </nav>
      </div>
    </div>
    <div id="asset-message" class="asset-message" role="status"><p>거점을 불러오는 중…</p></div>
    <header class="hud">
      <div class="resources">
        <span class="gold" data-icon="coin" aria-label="골드"><strong id="gold-value">120</strong> G</span>
        <button class="hud-button" type="button" id="people-button" data-icon="person" aria-label="인물 선택"><b id="population-value">2</b><span id="capacity-value"> / 6</span></button>
      </div>
        <div class="playback-controls">
          <button id="pause-button" class="hud-button" type="button" data-icon="pause" aria-label="일시 정지" aria-pressed="false"></button>
          <button id="speed-button" class="hud-button" type="button" aria-label="재생 속도 2배로 변경">1×</button>
          <button id="operations-button" class="hud-button" type="button" popovertarget="camp-menu" data-icon="flag" aria-label="원정과 거점 관리"><span id="expedition-countdown" hidden></span></button>
        </div>
    </header>
    <div class="camera-controls" aria-label="거점 이동">
      <button type="button" class="hud-button" data-pan="-1" data-icon="left" aria-label="왼쪽으로 이동"></button>
      <button type="button" class="hud-button" data-pan="1" data-icon="right" aria-label="오른쪽으로 이동"></button>
    </div>
    <section id="member-panel" class="member-panel pixel-panel" popover="auto" aria-label="인물과 시설">
          <div class="panel-heading"><strong id="facility-title">인물</strong><button type="button" class="hud-button" popovertarget="member-panel" popovertargetaction="hide" data-icon="close" aria-label="닫기"></button></div>
          <div id="roster-list" class="roster-list" aria-label="인물 선택"></div>
          <div id="roster-empty" class="roster-empty" hidden><p>육성 인원이 없습니다.</p><button id="open-dispatch" class="quiet-button" type="button">원정 열기</button></div>
          <div id="member-content">
            <div class="member-summary">
              <div class="portrait-frame"><img id="member-portrait" src="../Art/Source/swordsman-simple-master.png" alt="선택한 인물의 초상화"></div>
              <div><h2 id="member-name">루카</h2><p id="member-talent">무예 적성</p></div>
            </div>
            <div class="stats" aria-label="능력과 컨디션">
              <span>무예 <strong id="martial-value">3</strong></span>
              <span>예능 <strong id="performance-value">1</strong></span>
              <span>컨디션 <strong id="condition-value">100</strong></span>
            </div>

            <div id="schedule-box" class="schedule-box" hidden>
              <div class="schedule-top"><strong id="schedule-label">무예 교육</strong><span id="schedule-time"></span></div>
              <div id="job-progress" class="job-progress" role="progressbar" aria-label="현재 일정 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="job-progress-fill"></i></div>
              <button id="cancel-job" class="text-button" type="button">일정 중단</button>
            </div>

            <div id="action-picker">
              <div class="action-tabs" role="group" aria-label="일정 종류">
                <button type="button" data-view="education" aria-pressed="true">교육</button>
                <button type="button" data-view="activity" aria-pressed="false">활동</button>
                <button type="button" data-view="rest" aria-pressed="false">휴식</button>
              </div>
              <div class="action-options" data-view-panel="education">
                <button id="action-martial" type="button" data-job="martial"><strong>무예 교육</strong><small id="hint-martial">8 G · 10초</small></button>
                <button id="action-performance" type="button" data-job="performance"><strong>예능 교육</strong><small id="hint-performance">8 G · 10초</small></button>
              </div>
              <div class="action-options" data-view-panel="activity" hidden>
                <button id="action-arena" type="button" data-job="arena"><strong>경기 출전</strong><small id="hint-arena">12초</small></button>
                <button id="action-show" type="button" data-job="show"><strong>공연 출연</strong><small id="hint-show">12초</small></button>
              </div>
              <div class="action-options single" data-view-panel="rest" hidden>
                <button id="action-rest" type="button" data-job="rest"><strong>숙소에서 휴식</strong><small id="hint-rest">무료 · 컨디션 +40</small></button>
              </div>
              <p id="action-explanation" class="action-explanation"></p>
            </div>

            <div class="member-footer">
              <details class="member-details"><summary>인물 정보</summary><div class="detail-content"><p id="member-origin"></p><p><span id="martial-aptitude"></span> · <span id="performance-aptitude"></span></p><p>경기 <b id="member-wins">0</b>승 · 공연 <b id="member-shows">0</b>회</p></div></details>
              <button id="sell-button" class="sell-button" type="button">판매 <strong id="sell-value">32 G</strong></button>
            </div>
          </div>
    </section>
    <section id="camp-menu" class="camp-menu pixel-panel" popover="auto" aria-label="원정과 거점 관리">
        <div class="panel-heading"><strong>거점 관리</strong><button type="button" class="hud-button" popovertarget="camp-menu" popovertargetaction="hide" data-icon="close" aria-label="닫기"></button></div>
        <div class="operations-grid">
          <section class="dispatch-panel" aria-labelledby="dispatch-heading">
            <h2 id="dispatch-heading">주인공 일행</h2>
            <div id="crew-list" class="crew-list"></div>
            <p class="muted">육성 인원은 거점에 남습니다.</p>
            <div class="expedition-status"><span id="expedition-label">안개 숲길</span><span id="expedition-time">18초</span></div>
            <div class="small-progress"><i id="expedition-fill"></i></div>
            <button id="dispatch-button" class="primary-button" type="button"><span id="dispatch-text">일행 파견</span><small id="dispatch-sub">새 인원 1명</small></button>
            <p id="dispatch-hint" class="microcopy"></p>
          </section>
          <section class="expansion-panel" aria-label="시설 확장">
            <h2>시설 확장</h2><p class="muted">교육 자리 <span id="training-value">0 / 1</span> · 숙소 정원 <span id="capacity-summary">6명</span></p>
            <button id="expand-training" class="expansion-button" type="button"><span>교육 자리 +1</span><strong id="training-cost">90 G</strong></button>
            <button id="expand-capacity" class="expansion-button" type="button"><span>숙소 정원 +2</span><strong id="capacity-cost">70 G</strong></button>
          </section>
        </div>
        <details class="journal"><summary>기록</summary><ol id="event-log"><li>첫 교육을 기다립니다.</li></ol></details>
        <footer><span id="save-status">자동 저장</span><button id="reset-button" type="button">처음부터</button></footer>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <output id="game-status" class="sr-only" aria-live="off">거점 준비 중</output>
  <dialog id="sale-dialog"><form method="dialog"><h2><span id="sale-name">인물</span> 판매</h2><p>판매하면 거점 명단에서 떠납니다.</p><strong id="sale-price" class="sale-price">32 G</strong><div class="dialog-actions"><button class="quiet-button" value="cancel">계속 육성</button><button class="primary-button" value="sell">판매 확정</button></div></form></dialog>
  <dialog id="reset-dialog"><form method="dialog"><h2>거점을 처음부터 시작할까요?</h2><p>인원·골드·시설과 진행 중인 일정이 초기화됩니다.</p><div class="dialog-actions"><button class="quiet-button" value="cancel">계속하기</button><button class="danger-button" value="reset">초기화하기</button></div></form></dialog>
  <script type="module" src="./game.js"></script>
</body>
</html>
